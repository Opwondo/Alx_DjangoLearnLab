services:
  - type: web
    name: social-media-api
    runtime: python
    repo: https://github.com/Opwondo/Alx_DjangoLearnLab
    plan: free
    region: oregon  # or ohio, frankfurt, singapore
    branch: main
    rootDir: social_media_api  # 
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn social_media_api.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DJANGO_SETTINGS_MODULE
        value: social_media_api.settings_render
      - key: WEB_CONCURRENCY
        value: 2
      - key: PYTHON_VERSION
        value: 3.12.3
      # Database credentials
      - key: DB_NAME
        fromDatabase:
          name: social-media-api-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: social-media-api-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: social-media-api-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: social-media-api-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: social-media-api-db
          property: port
      - key: DATABASE_URL
        fromDatabase:
          name: social-media-api-db
          property: connectionString

databases:
  - name: social-media-api-db
    databaseName: social_media
    user: social_media_user
    plan: free
    region: oregon