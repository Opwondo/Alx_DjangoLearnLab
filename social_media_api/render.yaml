# render.yaml
services:
  - type: web
    name: social-media-api
    runtime: python
    region: ohio
    plan: free
    branch: main
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn social_media_api.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: DJANGO_SETTINGS_MODULE
        value: social_media_api.settings_render
      - key: WEB_CONCURRENCY
        value: 2
      - key: PYTHON_VERSION
        value: 3.12.3
      # Database credentials from Render's managed database
      - key: DB_NAME
        fromDatabase:
          name: social-media-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: social-media-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: social-media-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: social-media-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: social-media-db
          property: port
      # Keep DATABASE_URL for compatibility
      - key: DATABASE_URL
        fromDatabase:
          name: social-media-db
          property: connectionString
      # AWS S3 credentials 
      # - key: AWS_ACCESS_KEY_ID
      #   sync: false
      # - key: AWS_SECRET_ACCESS_KEY
      #   sync: false
      # - key: AWS_STORAGE_BUCKET_NAME
      #   sync: false
      # - key: AWS_S3_REGION_NAME
      #   value: us-east-1
    healthCheckPath: /health/

databases:
  - name: social-media-db
    plan: free
    databaseName: social_media
    user: social_media_user
    region: ohio